<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>2027 AviusULD Calendar</title>
  <rect width="512" height="512" rx="112" fill="#53565A"/>
  <!-- calendar page -->
  <rect x="72" y="104" width="368" height="336" rx="40" fill="#FFFFFF"/>
  <path d="M112 104h288a40 40 0 0 1 40 40v76H72v-76a40 40 0 0 1 40-40z" fill="#00C19F"/>
  <!-- binding rings -->
  <rect x="150" y="68" width="36" height="84" rx="18" fill="#ECECEC" stroke="#101820" stroke-width="8"/>
  <rect x="326" y="68" width="36" height="84" rx="18" fill="#ECECEC" stroke="#101820" stroke-width="8"/>
  <!-- year on the green header -->
  <text x="256" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="58" letter-spacing="4" fill="#FFFFFF">2027</text>
  <!-- AviusULD logo on the page -->
  <image x="116" y="242" width="280" height="135" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  <!-- small date grid dots echoing a calendar -->
  <g fill="#00C19F"><rect x="132" y="396" width="44" height="14" rx="7"/><rect x="194" y="396" width="44" height="14" rx="7" fill="#ECECEC"/><rect x="256" y="396" width="44" height="14" rx="7" fill="#ECECEC"/><rect x="318" y="396" width="62" height="14" rx="7" fill="#ECECEC"/></g>
</svg>